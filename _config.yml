title: Sayak Chowdhury
tagline: Research Scholar @ IIIT Bangalore
url: "https://sykchw.github.io"
baseurl: ""
author:
  name: Sayak Chowdhury
  github: your-github-username         # used in https://github.com/USERNAME
  twitter: your-twitter-handle         # used in https://twitter.com/HANDLE
  linkedin: your-linkedin-handle       # used in https://www.linkedin.com/in/HANDLE/
  cv: "https://link-to-your-cv.pdf"    # full URL, e.g. a Google Drive share link

description: >
  Personal academic site of Sayak Chowdhury — research, blog, and notes on
  neural network verification, AI safety, and machine learning.

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  footnote_nr: 1

highlighter: rouge

permalink: /blog/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: pages
    values:
      layout: default

plugins:
  - jekyll-scholar
  - jekyll-feed
  - jekyll-sitemap

feed:
  posts_limit: 25

scholar:
  style: apa
  locale: en
  source: ./_bibliography
  bibliography: references.bib
  replace_strings: true
  join_strings: true
  query: "@*"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - blog
  - "*.gemspec"


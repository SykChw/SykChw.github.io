<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  {% feed_meta %}

  <!-- MathJax: supports $...$ inline and $$...$$ / \[...\] display -->
  <script>
    window.MathJax = {
      loader: { load: ['[tex]/mathtools'] },
      tex: {
        packages: { '[+]': ['mathtools'] },
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams'
      },
      svg: { fontCache: 'global' },
      options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
    };
  </script>
  <!-- Pinned to an exact version with Subresource Integrity so a compromised
       CDN can never silently serve different code. -->
  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js"
    integrity="sha384-Wuix6BuhrWbjDBs24bXrjf4ZQ5aFeFWBuKkFekO2t8xFU0iNaLQfp2K6/1Nxveei"
    crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="brand-logo" src="{{ '/assets/images/logo.png' | relative_url }}" alt="">
      <span>{{ site.title }}</span>
    </a>
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains "/blog/" %}class="active"{% endif %}>Blog</a>
      <a href="{{ '/news/' | relative_url }}" {% if page.url == "/news/" %}class="active"{% endif %}>News</a>
      <a href="{{ '/research/' | relative_url }}" {% if page.url == "/research/" %}class="active"{% endif %}>Research</a>
    </nav>
  </header>

  <main class="page-wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    © {{ site.time | date: '%Y' }} {{ site.author.name }} · built with Jekyll, deployed via GitHub Actions
  </footer>

  <!-- Mermaid: dark theme only, with custom class defs available to posts.
       Using the self-contained UMD bundle (not the ESM build, which pulls
       unprotected chunk files via dynamic import -- SRI can't cover those)
       so the single integrity hash below covers the whole library. -->
  <script
    src="https://cdn.jsdelivr.net/npm/mermaid@11.17.2/dist/mermaid.min.js"
    integrity="sha384-EOXBFmc3gx5mb+vn0vPvvGqACToJD24hhacX5Yx+8NUUQrHIle/Qi5Bg9o3zKwW2"
    crossorigin="anonymous"></script>
  <script>
    // Kramdown + Rouge render fenced ```mermaid blocks as
    // <pre><code class="language-mermaid">...</code></pre>, not
    // <div class="mermaid">...</div> -- which is the only thing Mermaid's
    // startOnLoad/run() ever scans for. Convert them here before running.
    function hoistMermaidCodeBlocks(root) {
      root.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
        var div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = code.textContent;
        code.parentElement.replaceWith(div);
      });
    }

    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      themeVariables: {
        background: "#121214",
        primaryColor: "#1a1a1d",
        primaryTextColor: "#e4e4e7",
        primaryBorderColor: "#4a9ec4",
        lineColor: "#71717a",
        secondaryColor: "#1e1e22",
        tertiaryColor: "#1a1a1d"
      }
    });

    hoistMermaidCodeBlocks(document);
    mermaid.run().catch(function (err) { console.error("Mermaid render failed:", err); });
    window.__mermaidRun = function () {
      hoistMermaidCodeBlocks(document);
      mermaid.run().catch(function (err) { console.error("Mermaid render failed:", err); });
    };
  </script>

  <script src="{{ '/assets/js/toc.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/sidenotes.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/blog-search.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/responsive-tables.js' | relative_url }}" defer></script>
</body>
</html>
